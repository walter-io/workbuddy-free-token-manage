name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# softprops/action-gh-release 需要写权限才能创建 Release（新仓库默认 token 只读）
permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    strategy:
      # 一个平台失败不取消另一个平台，方便定位问题
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
          - os: macos-latest
            platform: mac
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # 缓存 Electron 二进制与 electron-builder 平台工具，显著缩短构建时间
      - name: Cache Electron binaries
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: ${{ runner.os }}-electron-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-

      - name: Install dependencies
        run: npm ci

      - name: Build renderer
        run: npm run build

      # --publish never 是必须的：
      # 构建 tag 时 electron-builder 会把未指定的 --publish 隐式推断为 onTag 并自行发布，
      # 而此步骤没有 GH_TOKEN 会直接报错，导致打包完成后整个构建失败。
      - name: Build installer
        run: npx electron-builder --${{ matrix.platform }} --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload debug info (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-${{ matrix.os }}
          path: |
            release/builder-debug.yml
            release/*.yml
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.dmg
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: installer-*

      - name: List installers
        run: find artifacts -type f | sort

      - name: Create Release and attach installers
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*.exe
            artifacts/**/*.dmg
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
