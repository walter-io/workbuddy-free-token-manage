appId: com.freetoken.desktop
productName: Free Token
directories:
  buildResources: build
  output: release
files:
  - dist/**
  - electron/**
  - server/**
  - package.json
asar: true
win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.png
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: Free Token
mac:
  target:
    - target: dmg
      arch: [arm64, x64]
  icon: build/icon.png
  category: public.app-category.developer-tools
  identity: null
npmRebuild: false
