appId: com.freetoken.desktop
productName: Free Token
directories:
  buildResources: build
  output: release
files:
  - dist/**
  - electron/**
  - server/**
  - build/**
  - package.json
# 统一产物命名（避免 productName 中的空格影响 Release 附件上传）
artifactName: Free-Token-${version}-${os}-${arch}.${ext}
asar: true
win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.png
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: Free Token
mac:
  target:
    - target: dmg
      arch: [arm64, x64]
  icon: build/icon.png
  category: public.app-category.developer-tools
  identity: null
npmRebuild: false
